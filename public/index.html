<div class="app-container" style="display: flex; height: calc(100vh - 60px);">
    
    <!-- LEFT SIDEBAR: The Scrollable Bot Hub Drawer -->
    <div class="bot-hub-sidebar" style="width: 300px; border-right: 1px solid var(--border-color); padding: 15px; overflow-y: auto;">
        <h3>Available Bots</h3>
        <div id="bot-list-container">
            <!-- Dynamically populated list of bots from /strategies/ -->
            <div class="bot-card-item active" style="padding: 10px; margin-bottom: 8px; border-radius: 6px; cursor: pointer; background: var(--card-bg);">
                <strong>Volatility Accumulator</strong>
                <div style="font-size: 12px; color: var(--text-muted);">ACCU • <span style="color: green;">Idle</span></div>
            </div>
        </div>
    </div>

    <!-- MAIN WORKSPACE: Focused Bot Panel -->
    <div class="main-workspace" style="flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px;">
        
        <!-- Active Bot Header & Controls -->
        <div class="workspace-header" style="background: var(--card-bg); padding: 20px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center;">
            <div>
                <h2 id="active-bot-title">Select a Bot from the Hub</h2>
                <p id="active-bot-desc" style="color: var(--text-muted); margin: 5px 0 0 0;">Choose a strategy from the left sidebar to view its configuration and performance.</p>
            </div>
            <div>
                <button id="run-bot-btn" class="btn-primary" style="padding: 10px 20px; font-weight: bold;" disabled>Run Bot</button>
            </div>
        </div>

        <!-- Metric Cards for Selected Bot -->
        <div class="metrics-grid" style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px;">
            <div class="metric-card"><h4>TOTAL TRADES</h4><p id="metric-trades">0</p></div>
            <div class="metric-card"><h4>WIN RATE</h4><p id="metric-winrate">0.0%</p></div>
            <div class="metric-card"><h4>NET PNL</h4><p id="metric-pnl">$0.00</p></div>
            <div class="metric-card"><h4>PROFIT FACTOR</h4><p id="metric-profit-factor">0.00</p></div>
        </div>

        <!-- Live Logs Terminal at Bottom -->
        <div class="logs-container" style="flex: 1; background: var(--card-bg); padding: 15px; border-radius: 8px; display: flex; flex-direction: column;">
            <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                <span>📋 Live Logs</span>
                <button id="clear-logs-btn" class="btn-sm">Clear</button>
            </div>
            <div id="terminal-logs" style="flex: 1; background: #000; color: #00ff00; font-family: monospace; padding: 10px; border-radius: 4px; overflow-y: auto; max-height: 200px;"></div>
        </div>

    </div>
</div>
