<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>QUANTCORE // TERMINAL</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <header class="app-header">
    <div class="left">
      <div class="app-brand">QUANTCORE<span>//</span>TERMINAL</div>
      <div class="header-tabs">
        <button class="nav-tab active" data-tab="dashboard">Dashboard</button>
        <button class="nav-tab" data-tab="analytics">Analytics</button>
        <button class="nav-tab" data-tab="logs">Logs</button>
        <button class="nav-tab" data-tab="settings">Settings</button>
      </div>
    </div>
    <div class="header-right">
      <span class="header-status" id="header-status">● IDLE</span>
      <span class="header-clock" id="clock-display">00:00:00</span>
      <button class="theme-toggle" id="themeToggle">🌙</button>
    </div>
  </header>

  <div class="app-body">
    <!-- Sidebar -->
    <aside class="app-sidebar" id="appSidebar">
      <div class="sidebar-metrics">
        <div class="metric"><span class="lbl">Profile</span><span class="val" id="m-profile">—</span></div>
        <div class="metric"><span class="lbl">Balance</span><span class="val" id="m-balance">—</span></div>
        <div class="metric"><span class="lbl">Session</span><span class="val" id="m-session">$0.00</span></div>
        <div class="metric"><span class="lbl">Daily</span><span class="val" id="m-daily">$0.00</span></div>
        <div class="metric" style="grid-column: span 2;"><span class="lbl">Risk</span><span class="val" id="m-stake">$0.00</span></div>
      </div>
      <div class="sidebar-controls">
        <button class="btn start" onclick="sendControl('start')">▶ Start</button>
        <button class="btn stop" onclick="sendControl('stop')">⏹ Stop</button>
        <button class="btn swap" onclick="swapEnvironment()">🔄</button>
      </div>
      <div class="sidebar-duration">
        <label>Dur</label>
        <input type="number" id="manual-duration" value="7" min="1" max="10">
        <select id="manual-unit">
          <option value="t" selected>Ticks</option>
          <option value="s">Sec</option>
          <option value="m">Min</option>
        </select>
      </div>
      <div class="sidebar-trade-btns">
        <button class="btn call" onclick="fireManual('CALL')">📈 CALL</button>
        <button class="btn put" onclick="fireManual('PUT')">📉 PUT</button>
      </div>
    </aside>

    <!-- Main -->
    <main class="app-main">
      <!-- Dashboard -->
      <div id="dashboard" class="tab-page active">
        <div class="table-container">
          <table class="data-table" id="dataTable">
            <thead>
              <tr>
                <th>Asset</th><th>Price</th><th>S/R</th><th>S/R %</th><th>Rise/Fall %</th>
                <th>Breakout</th><th>RSI</th><th>BB Squeeze</th><th>Micro Trend</th>
              </tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </div>

      <!-- Analytics -->
      <div id="analytics" class="tab-page">
        <div class="analytics-container">
          <div class="filter-bar">
            <button class="btn-preset" onclick="timeframePreset(this,'24h')">24H</button>
            <button class="btn-preset active" onclick="timeframePreset(this,'session')">Session</button>
            <button class="btn-preset" onclick="timeframePreset(this,'week')">1W</button>
            <button class="btn-preset" onclick="timeframePreset(this,'month')">1M</button>
            <button class="btn-preset" onclick="timeframePreset(this,'year')">1Y</button>
          </div>
          <div class="metrics-grid">
            <div class="metric-card"><span class="lbl">Net Profit</span><span class="val" id="meta-profit">$0.00</span></div>
            <div class="metric-card"><span class="lbl">Strike Rate</span><span class="val" id="meta-strike">0.0%</span></div>
            <div class="metric-card"><span class="lbl">Profit Factor</span><span class="val" id="meta-pf">0.00</span></div>
            <div class="metric-card"><span class="lbl">Max Drawdown</span><span class="val" id="meta-dd">0.0%</span></div>
          </div>
          <div class="charts-grid">
            <div class="chart-box"><div class="ch-label">Asset Performance</div><canvas id="chart-donut"></canvas></div>
            <div class="chart-box"><div class="ch-label">Equity Curve</div><canvas id="chart-line"></canvas></div>
          </div>
        </div>
      </div>

      <!-- Logs -->
      <div id="logs" class="tab-page">
        <div class="log-header"><span>📋 Live Log</span><button onclick="clearLogs()">Clear</button></div>
        <div class="log-stream" id="log-stream"></div>
      </div>

      <!-- Settings -->
      <div id="settings" class="tab-page">
        <div class="settings-grid">
          <!-- Basic settings – just as placeholders -->
          <div class="settings-section">
            <h4>Strategy</h4>
            <label>Analysis Window <input type="number" id="config-ANALYSIS_WINDOW" value="500" /></label>
            <label>Bollinger Period <input type="number" id="config-BOLLINGER_PERIOD" value="20" /></label>
            <label>Bollinger Std Dev <input type="number" id="config-BOLLINGER_STD" value="2" /></label>
            <label>RSI Period <input type="number" id="config-RSI_PERIOD" value="20" /></label>
            <label>Min Volatility <input type="number" id="config-MIN_VOLATILITY_PERCENT" value="0.10" /></label>
          </div>
          <button class="btn-save" onclick="saveSettings()">Apply</button>
        </div>
      </div>
    </main>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
